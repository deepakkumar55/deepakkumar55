    <text x="69" y="91" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="800">AI</text>
  </g>

  <g stroke="#7c3aed" stroke-width="2" opacity="0.45">
