<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Deepak Kumar — AI Full Stack Engineer</title>
  <desc id="desc">Professional banner for Deepak Kumar, Founder of TheCampusCoders</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.64"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2563eb" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1500" height="500" rx="26" fill="url(#bg)"/>
  <circle cx="1190" cy="245" r="205" fill="#dbeafe" opacity="0.72" filter="url(#soft)"/>
  <circle cx="1340" cy="120" r="120" fill="#ede9fe" opacity="0.72" filter="url(#soft)"/>

  <g opacity="0.28" fill="#2563eb">
    <circle cx="930" cy="95" r="3"/><circle cx="960" cy="95" r="3"/><circle cx="990" cy="95" r="3"/><circle cx="1020" cy="95" r="3"/>
    <circle cx="930" cy="125" r="3"/><circle cx="960" cy="125" r="3"/><circle cx="990" cy="125" r="3"/><circle cx="1020" cy="125" r="3"/>
    <circle cx="930" cy="155" r="3"/><circle cx="960" cy="155" r="3"/><circle cx="990" cy="155" r="3"/><circle cx="1020" cy="155" r="3"/>
  </g>

  <g transform="translate(78 128)">
    <rect x="0" y="-48" width="185" height="34" rx="17" fill="#eff6ff"/>
    <circle cx="19" cy="-31" r="5" fill="#2563eb"/>
    <text x="34" y="-24" fill="#2563eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">BUILDING IN PUBLIC</text>
    <text x="0" y="58" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Deepak Kumar</text>
    <rect x="0" y="82" width="590" height="5" rx="2.5" fill="url(#brand)"/>
    <text x="0" y="137" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650">AI Full Stack Engineer</text>
    <text x="305" y="137" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28">•</text>
    <text x="330" y="137" fill="#6d28d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650">Founder @ TheCampusCoders</text>
    <text x="0" y="191" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="0.4">NEXT.JS  •  TYPESCRIPT  •  AI  •  MERN</text>
  </g>

  <g transform="translate(1015 82)" filter="url(#shadow)">
    <rect x="0" y="0" width="365" height="278" rx="30" fill="url(#glass)" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="28" cy="27" r="6" fill="#2563eb"/><circle cx="49" cy="27" r="6" fill="#60a5fa"/><circle cx="70" cy="27" r="6" fill="#a78bfa"/>
    <rect x="25" y="55" width="88" height="197" rx="18" fill="#2563eb" opacity="0.92"/>
    <rect x="133" y="61" width="198" height="49" rx="15" fill="#dbeafe"/>
    <rect x="133" y="127" width="91" height="104" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="240" y="127" width="91" height="104" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
    <path d="M157 180l15-16m-15 16l15 16m28-32l15 16-15 16" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M260 196l17-24 15 13 20-31" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="196" r="5" fill="#7c3aed"/><circle cx="277" cy="172" r="5" fill="#7c3aed"/><circle cx="292" cy="185" r="5" fill="#7c3aed"/><circle cx="312" cy="154" r="5" fill="#7c3aed"/>
  </g>

