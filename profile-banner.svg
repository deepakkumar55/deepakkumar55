    <circle cx="1390" cy="115" r="7" fill="#2563eb"/><circle cx="1435" cy="163" r="7" fill="#7c3aed"/><circle cx="1404" cy="211" r="7" fill="#2563eb"/><circle cx="1458" cy="253" r="7" fill="#7c3aed"/>
